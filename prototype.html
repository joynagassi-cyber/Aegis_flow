<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN-VII Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #0a0a0a;
            --surface-2: #111111;
            --border: #222222;
            --primary: #0066FF;
            --text: #ffffff;
            --text-muted: #888888;
            --highlight: #00B4FF;
        }
        body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }
        .font-syne { font-family: 'Syne', sans-serif; }
        .glass { background: rgba(17, 17, 17, 0.7); backdrop-filter: blur(10px); border: 1px solid var(--border); }
        .bento-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 20px; padding: 24px; }
    </style>
</head>
<body class="p-8">
    <header class="mb-12 flex justify-between items-end">
        <div>
            <h1 class="font-syne text-5xl font-extrabold tracking-tighter">TITAN-VII</h1>
            <p class="text-var(--text-muted) mt-2 tracking-widest uppercase text-xs">Command Center // Day 45</p>
        </div>
        <div class="flex gap-4">
            <div class="px-6 py-3 rounded-full bg-[var(--primary)] text-white font-bold text-sm">Synchronisation Active</div>
        </div>
    </header>

    <div class="grid grid-cols-4 gap-6">
        <!-- Main Metrics -->
        <div class="bento-card col-span-2">
            <h2 class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider mb-6">Indice de Puissance Spirituelle</h2>
            <div class="flex items-center gap-8">
                <div class="w-32 h-32 rounded-full border-4 border-[var(--primary)] flex items-center justify-center font-syne text-4xl font-bold">88</div>
                <div>
                    <p class="text-lg font-bold">Performance Exceptionnelle</p>
                    <p class="text-[var(--text-muted)] text-sm">Maintenez cette dynamique pour atteindre les objectifs du mois.</p>
                </div>
            </div>
        </div>

        <div class="bento-card">
            <h2 class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider mb-6">Streak Anglais</h2>
            <p class="font-syne text-5xl font-extrabold">24<span class="text-xl text-[var(--text-muted)] ml-2">Jours</span></p>
        </div>

        <div class="bento-card">
            <h2 class="text-xs font-bold text-[var(--text-muted)] uppercase tracking-wider mb-6">Tâches SaaS</h2>
            <p class="font-syne text-5xl font-extrabold">12<span class="text-xl text-[var(--text-muted)] ml-2">/15</span></p>
        </div>
    </div>
</body>
</html>
